name: update blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash update-blocklist.sh
